<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IPL 2026 - Ticket Booking</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>IPL 2026 Ticket Booking</h1>

      <nav>
        <a href="index.html">Home</a>
        <a href="index.html#matches">Matches</a>
        <a href="booking.html">Book Ticket</a>
        <a href="index.html#my-bookings">My Bookings</a>
        <a href="index.html#guidelines">Guidelines</a>
      </nav>
    </header>

    <section id="book-ticket">
      <h2>Book Your IPL 2026 Tickets</h2>
      <p>Fill in the details below to book your stadium tickets.</p>

      <form action="#" method="get">
        <p>
          <label for="name">Full Name:</label><br />
          <input
            type="text"
            id="name"
            name="name"
            placeholder="Enter your full name"
            minlength="3"
            maxlength="50"
            required
          />
        </p>

        <p>
          <label for="email">Email Address:</label><br />
          <input
            type="email"
            id="email"
            name="email"
            placeholder="example@gmail.com"
            required
          />
        </p>

        <p>
          <label for="phone">Phone Number:</label><br />
          <input
            type="tel"
            id="phone"
            name="phone"
            placeholder="Enter 10-digit mobile number"
            pattern="[6-9][0-9]{9}"
            minlength="10"
            maxlength="10"
            required
          />
        </p>

        <p>
          <label for="match">Select Match:</label><br />
          <select id="match" name="match" required>
            <option value="">-- Select a Match --</option>
            <option value="RCB vs CSK">RCB vs CSK</option>
            <option value="MI vs KKR">MI vs KKR</option>
            <option value="SRH vs RR">SRH vs RR</option>
            <option value="GT vs DC">GT vs DC</option>
            <option value="PBKS vs LSG">PBKS vs LSG</option>
          </select>
        </p>

        <p>
          <label for="stand">Select Stand Category:</label><br />
          <select id="stand" name="stand" required>
            <option value="">-- Select Stand --</option>
            <option value="General">General Stand</option>
            <option value="Premium">Premium Stand</option>
            <option value="VIP">VIP Stand</option>
          </select>
        </p>

        <p>
          <label for="tickets">Number of Tickets:</label><br />
          <input
            type="number"
            id="tickets"
            name="tickets"
            min="1"
            max="6"
            value="1"
            required
          />
        </p>

        <p>
          <label>Preferred Seating:</label><br />

          <input
            type="radio"
            id="near-field"
            name="seating"
            value="Near the field"
            required
          />
          <label for="near-field">Near the Field</label>

          <input
            type="radio"
            id="upper-stand"
            name="seating"
            value="Upper Stand"
          />
          <label for="upper-stand">Upper Stand</label>
        </p>

        <p>
          <input type="checkbox" id="updates" name="updates" value="yes" />
          <label for="updates">Receive match updates through email</label>
        </p>

        <p>
          <button type="submit">Submit Booking</button>
          <button type="reset">Reset Form</button>
        </p>
      </form>
    </section>

    <footer>
      <p>&copy; 2026 IPL Ticket Booking. All Rights Reserved.</p>
    </footer>
  </body>
  <script src="app.js"></script>
</html>
